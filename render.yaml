services:
  - type: web
    name: bookstory
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com,bookstory-b9l5.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://bookstory-b9l5.onrender.com"
